name: railway-image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/sethwalker2155-png/reminderbot:latest
            ghcr.io/sethwalker2155-png/reminderbot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish a public copy Railway can pull
        run: |
          docker buildx imagetools create \
            --tag ttl.sh/dodo-goldy-reminderbot:24h \
            ghcr.io/sethwalker2155-png/reminderbot:latest
